{% extends "shift_management/base.html" %}
{% block content %}


<h1>シフト提出</h1>
<h2>{{ year }}<span>年</span>{{ month }}月</h2>

<form method="post">
    {% csrf_token %}
<table>
    <tr>
        <th>日付</th>
        <th>曜日</th>
        <th>{{ submission_type }}</th> 
        <th>出勤可能時間</th>
        <th>メモ</th>
    </tr>
    {% for item in days %}
    <tr>
        <td>{{ item.day }}</td>
        <td>{{ item.weekday }}</td>
        <td><input type="checkbox" name="day_{{ item.day }}"></td>
        <td>
            <input type="time" name="start_{{ item.day }}">
            ～
            <input type="time" name="end_{{ item.day }}">
        </td>
        <td>
            <textarea name="note_{{ item.day }}"></textarea>
        </td>
    </tr>
    {% endfor %}
</table>
<br>
<button type="submit">提出</button>
</form>


<p><a href="{% url 'shift_management:staff_main' %}">メインページ</a></p>
{% endblock %}
