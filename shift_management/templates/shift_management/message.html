
{% extends "shift_management/base.html" %}

{% block extra_head %}
<style>
    .chat-container {
        display: flex;
        height: calc(100vh - 110px);
        min-height: 450px;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        overflow: hidden;
        color: #333;
    }

    /* 左側：会話一覧 */
    .chat-sidebar {
        width: 280px;
        flex-shrink: 0;
        border-right: 1px solid #e5e5e5;
        display: flex;
        flex-direction: column;
    }

    .chat-sidebar-header {
        padding: 20px;
        border-bottom: 1px solid #e5e5e5;
    }

    .chat-sidebar-header h2 {
        margin: 0;
        font-size: 18px;
    }

    .chat-list {
        overflow-y: auto;
        flex: 1;
    }

    .chat-user {
        width: 100%;
        padding: 16px;
        border: none;
        border-bottom: 1px solid #f0f0f0;
        background: white;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        font: inherit;
        color: inherit;
    }

    .chat-user:hover {
        background: #f7f9fc;
    }

    .chat-user.active {
        background: #edf3fb;
    }

    .chat-avatar {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #e8edf4;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #5d718b;
        font-weight: bold;
    }

    .chat-user-info {
        min-width: 0;
        flex: 1;
    }

    .chat-user-name {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
    }

    .chat-preview {
        font-size: 12px;
        color: #888;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* 右側：メッセージ */
    .chat-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .chat-header {
        padding: 18px 24px;
        border-bottom: 1px solid #e5e5e5;
        font-weight: bold;
        font-size: 16px;
    }

    .chat-messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .chat-message {
        display: flex;
        gap: 10px;
        max-width: 80%;
        align-self: flex-start;
    }

    .chat-message.mine {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .message-content {
        min-width: 0;
    }

    .message-name {
        font-size: 12px;
        color: #777;
        margin-bottom: 6px;
    }

    .mine .message-name {
        text-align: right;
    }

    .message-bubble {
        background: #f2f3f5;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .mine .message-bubble {
        background: #e8f2ff;
    }

    .message-time {
        font-size: 11px;
        color: #999;
        margin-top: 5px;
    }

    .mine .message-time {
        text-align: right;
    }

    /* 入力欄 */
    .chat-input-area {
        padding: 16px 24px;
        border-top: 1px solid #e5e5e5;
    }

    .chat-textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 85px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font: inherit;
        font-size: 14px;
        resize: vertical;
        outline: none;
    }

    .chat-textarea:focus {
        border-color: #82a9dc;
    }

    .chat-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
    }

    .chat-send {
        background: #3478c7;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px 28px;
        font-size: 14px;
        cursor: pointer;
    }

    .chat-send:hover {
        background: #2865aa;
    }

    @media (max-width: 650px) {
        .chat-sidebar {
            width: 115px;
        }

        .chat-user {
            padding: 10px;
        }

        .chat-avatar {
            display: none;
        }

        .chat-messages {
            padding: 12px;
        }

        .chat-input-area {
            padding: 12px;
        }

        .chat-header {
            padding: 15px;
        }

        .chat-message {
            max-width: 95%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-container">

    <!-- 左側：会話一覧 -->
    <aside class="chat-sidebar">
        <div class="chat-sidebar-header">
            <h2>メッセージ</h2>
        </div>

        <div class="chat-list">

            <button class="chat-user active" type="button">
                <div class="chat-avatar">田</div>
                <div class="chat-user-info">
                    <div class="chat-user-name">田中さん</div>
                    <div class="chat-preview">
                        シフトの件、了解です！
                    </div>
                </div>
            </button>

            <button class="chat-user" type="button">
                <div class="chat-avatar">佐</div>
                <div class="chat-user-info">
                    <div class="chat-user-name">佐藤さん</div>
                    <div class="chat-preview">
                        お疲れ様です。
                    </div>
                </div>
            </button>

        </div>
    </aside>

    <!-- 右側：チャット画面 -->
    <section class="chat-main">

        <div class="chat-header">
            田中さん
        </div>

        <div class="chat-messages">

            <!-- 相手のメッセージ -->
            <div class="chat-message">
                <div class="chat-avatar">田</div>

                <div class="message-content">
                    <div class="message-name">田中さん</div>
                    <div class="message-bubble">来月のシフトについて確認したいです。</div>
                    <div class="message-time">10:30</div>
                </div>
            </div>

            <!-- 自分のメッセージ -->
            <div class="chat-message mine">
                <div class="chat-avatar">自</div>

                <div class="message-content">
                    <div class="message-name">自分</div>
                    <div class="message-bubble">はい！大丈夫です。</div>
                    <div class="message-time">10:35</div>
                </div>
            </div>

            <!-- 相手のメッセージ -->
            <div class="chat-message">
                <div class="chat-avatar">田</div>

                <div class="message-content">
                    <div class="message-name">田中さん</div>
                    <div class="message-bubble">ありがとうございます！
では、後ほど詳細を送ります。</div>
                    <div class="message-time">10:38</div>
                </div>
            </div>

        </div>

        <!-- メッセージ入力欄 -->
        <div class="chat-input-area">
            <form method="post">
                {% csrf_token %}

                <textarea
                    class="chat-textarea"
                    name="message"
                    placeholder="メッセージを入力してください"
                ></textarea>

                <div class="chat-actions">
                    <button class="chat-send" type="button">
                        送信
                    </button>
                </div>
            </form>
        </div>

    </section>
</div>
{% endblock %}
