{% block content %}
    <body>
    <h1>従業員登録</h1>
        <form>
            従業員番号<input type="text" name="username" id="username">
            <br>
            <br>
            氏名<input type="text" name="name" id="name" ><input type="text" name="firstname" id="fastname">
            <br>
            <br>
            入社日<input type="date" name="joined_on" id="joined_on">
            <br>
            <br>
            終電時間<input type="time" name="last_train_departure_time" id="last_train_departure_time">
            <br>
            <br>
            <label>
                <input type="checkbox" name="is_trainee" id="is_trainee" value="1">研修中
            </label>
            <br>
            <br>
            シフトカラー<input type="color" name="color" id="color">
            <br>
            <br>
            メモ<textarea name="note" id="note"></textarea>
            <br>
            <br>
            <details>
                <summary>詳細登録</summary>
                <br>
                    <p>権限区分
                    <label>
                        <input type="radio" name="role" value="1">
                        一般従業員
                    </label>

                    <label>
                        <input type="radio" name="role" value="2">
                        管理者
                    </label>
                    </p>
                    <p>
                    <br>
                    時給<input type="text" name="hourly_wage" id="hourly_wage">
                    <br>
                    </p>

                    <p>
                    <br>
                    シフト提出方法
                    <br>
                    <label>
                        <input type="radio" name="submission_type" value="1">
                        出勤可能な日を選択（出勤日数の少ないスタッフ向け）
                    </label>
                    <br>
                    <label>
                        <input type="radio" name="submission_type" value="2">
                        休みの希望を選択（出勤日数の多いスタッフ向け）
                    </label>
                    </p>
                    <p>
                    <br>
                    最低シフト提出日数<input type="text" name="minimum_available_days" id="minimum_available_days">
                    <p>提出日数不足の警告の有無</p>
                    <label>
                        <input type="radio" name="show_submission_warning" id="show_submission_warning_true" value="1">
                        有り
                    </label>
                    <label>
                        <input type="radio" name="show_submission_warning" id="show_submission_warning_false" value="2">
                        無し
                    </label>
                    </p>
                    <p>権限
                        <br>
                    <label>
                        <input type="checkbox" name="is_position_holder" id="is_position_holder" value="1">役職者か
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="can_view_all_shifts" id="can_view_all_shifts" value="2">全体シフトの閲覧権限
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="can_view_shortage" id="can_view_shortage" value="3">不足枠の閲覧権限
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="shift_priority" id="shift_priority" value="4">シフト優先
                    </label>
                    </p>

                    <p>
                    <br>
                    研修終了予定日<input type="date" name="training_end_date" id="training_end_date">
                    <br>
                    試用期間終了日<input type="date" name="probation_end_date" id="probation_end_date">
                    <br>
                    年間収入上限<input type="text" name="annual_income_limit" id="annual_income_limit">
                    <br>
                    本人が希望する月の勤務時間<input type="text" name="desired_monthly_minutes" id="desired_monthly_minutes">
                    </p>   
            </details>
            <br>
            <br>
            <button type="submit">登録</button>
        </form>
        <br>
        <p><a href="{% url 'shift_management:all_staff' %}">従業員一覧</a></p>
        <p><a href="{% url 'shift_management:manager_main' %}">メインページ</a></p>

    </body>


{% endblock %}
